# =============================================================
# Perfil de produção — API no Render, Postgres no Neon.
#
# Este arquivo não tem um único valor padrão para credencial ou origem: tudo
# vem do ambiente. Placeholder que não resolve derruba a aplicação na partida,
# e é isso que se quer — um deploy sem JWT_SECRET que sobe é um deploy que
# assina token com segredo de outra pessoa.
# =============================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # O Neon no plano gratuito faz scale-to-zero e derruba conexões ociosas
    # sem avisar o cliente. Pool grande aqui não é folga, é estoque de conexão
    # morta: cada uma volta como "connection closed" na primeira requisição
    # depois da hibernação. Daí o pool mínimo, o idle curto (60 s, bem abaixo
    # de qualquer janela de corte do provedor) e o max-lifetime de 5 min, que
    # recicla a conexão antes de o outro lado decidir por conta própria.
    hikari:
      pool-name: nutriclinica-pool
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 30000   # 30 s — cobre o cold start do Neon
      idle-timeout: 60000         # 1 min
      max-lifetime: 300000        # 5 min

  jpa:
    # O schema é do Flyway. Em produção o Hibernate só confere se o que ele
    # espera bate com o que a migration criou, e recusa subir se não bater.
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  jwt:
    # Sem default de propósito: ver o cabeçalho.
    secret: ${JWT_SECRET}
    access-token-minutos: 15
    refresh-token-dias: 7

  cors:
    # Lista separada por vírgula — a URL do frontend na Vercel.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  # Administrador inicial, criado pelo AdminInicialRunner apenas se a tabela
  # usuario estiver vazia. O default vazio existe para que a falta da variável
  # vire uma mensagem de validação legível ("Defina ADMIN_EMAIL...") em vez do
  # erro cru de placeholder não resolvido — em ambos os casos a aplicação
  # recusa subir, que é o comportamento pedido.
  admin:
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_PASSWORD:}

# Swagger fora do ar em produção. Desabilitar só a UI não bastaria: o
# /v3/api-docs é rota pública no SecurityConfig e serviria o contrato inteiro
# para quem pedisse.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Só o health, e sem detalhe: é o endpoint que o Render consulta, e ele é
# público. "never" impede que a resposta descreva o estado do banco e do disco
# para qualquer um que faça o GET.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    br.edu.nutriclinica: INFO
    org.hibernate: WARN
