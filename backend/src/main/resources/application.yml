spring:
  application:
    name: nutriclinica-api

  profiles:
    default: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Schema é responsabilidade exclusiva do Flyway. Nunca use "update".
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  jwt:
    # Sem default aqui de proposito: fora do perfil dev a aplicacao deve falhar
    # ao subir se JWT_SECRET nao estiver definida.
    secret: ${JWT_SECRET}
    access-token-minutos: 15
    refresh-token-dias: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/nutriclinica}
    username: ${DB_USERNAME:nutriclinica}
    password: ${DB_PASSWORD:nutriclinica}

  jpa:
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-nutriclinica-hs256-troque-em-producao}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    br.edu.nutriclinica: DEBUG
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

  # Em produção não há default: as variáveis de ambiente são obrigatórias.
  jpa:
    show-sql: false

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    br.edu.nutriclinica: INFO
