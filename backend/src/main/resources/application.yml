spring:
  application:
    name: nutriclinica-api

  profiles:
    default: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Schema é responsabilidade exclusiva do Flyway. Nunca use "update".
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# O perfil dev fica no documento abaixo; o de produção mora em
# application-prod.yml, separado por ser o único que lê o ambiente inteiro
# sem default.

app:
  jwt:
    # Sem default aqui de proposito: fora do perfil dev a aplicacao deve falhar
    # ao subir se JWT_SECRET nao estiver definida.
    secret: ${JWT_SECRET}
    access-token-minutos: 15
    refresh-token-dias: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: dev

    # O .env da raiz do monorepo entra como fonte de propriedades: é dele que
    # saem DB_URL, DB_USERNAME e DB_PASSWORD quando se quer apontar o dev para
    # outro banco (o Neon, por exemplo) sem editar este arquivo, que é
    # versionado. Os dois caminhos cobrem rodar de /backend (mvnw) e da raiz
    # (java -jar); ambos opcionais, então a ausência do .env não quebra nada.
    # Variável de ambiente de verdade continua vencendo o .env, e entre os dois
    # arquivos vence o último da lista.
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/nutriclinica}
    username: ${DB_USERNAME:nutriclinica}
    password: ${DB_PASSWORD:nutriclinica}

  jpa:
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-nutriclinica-hs256-troque-em-producao}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    br.edu.nutriclinica: DEBUG
    org.hibernate.SQL: DEBUG
