# Perfil de integração: banco real via Testcontainers (PostgreSQL 17).
# O DataSource vem do @ServiceConnection, então nada é configurado aqui.
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        # Habilita o contador de consultas usado por ProntuarioConsultasIT para
        # provar que montar o prontuário não é N+1.
        generate_statistics: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: segredo-de-teste-nutriclinica-com-mais-de-32-bytes
    access-token-minutos: 15
    refresh-token-dias: 7
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
